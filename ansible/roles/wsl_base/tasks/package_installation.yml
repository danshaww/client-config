# --- APT Packages --- #
- name: Package Installation | Add APT GPG Keys
  ansible.builtin.apt_key:
    url: "{{ item.apt_key_url }}"
    keyring: "{{ item.keyring }}"
  become: true
  with_items: "{{ apt_sources }}"

- name: Package Installation | Add APT Repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo }}"
    state: present
    filename: "{{ item.filename }}"
  become: true
  with_items: "{{ apt_sources }}"

- name: Package Installation | Install Packages
  become: true
  ansible.builtin.apt:
    pkg: "{{ packages }}"
    update_cache: true
  when: ansible_os_family == "Debian"

# --- Other Packages --- #
- name: Package Installation | Kubernetes CLI | Get stable version
  ansible.builtin.uri:
    url: https://dl.k8s.io/release/stable.txt
    return_content: true
  register: kubectl_version
  changed_when: false

- name: Package Installation | Kubernetes CLI | Install kubectl
  become: true
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version.content | trim }}/bin/linux/{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}/kubectl"
    dest: /usr/local/bin/kubectl
    mode: '0755'

- name: Package Installation | Flux CLI | Install
  become: true
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://fluxcd.io/install.sh | bash
  args:
    creates: /usr/local/bin/flux
    executable: /bin/bash

- name: Package Installation | K9s CLI | Check for executable
  ansible.builtin.stat:
    path: /usr/local/bin/k9s
  register: k9s_installed

- name: Package Installation | K9s CLI | Download archive
  ansible.builtin.get_url:
    url: "https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}.tar.gz"
    dest: /tmp/k9s.tar.gz
    mode: '0644'
  when: not k9s_installed.stat.exists

- name: Package Installation | K9s CLI | Extract executable
  become: true
  ansible.builtin.unarchive:
    src: /tmp/k9s.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - k9s
    creates: /usr/local/bin/k9s
  when: not k9s_installed.stat.exists

- name: Package Installation | K9s CLI | Set executable permissions
  become: true
  ansible.builtin.file:
    path: /usr/local/bin/k9s
    state: file
    mode: '0755'

- name: Package Installation | K9s CLI | Remove downloaded archive
  ansible.builtin.file:
    path: /tmp/k9s.tar.gz
    state: absent
  when: not k9s_installed.stat.exists

- name: Package Installation | Bitwarden Secrets Manager CLI | Install
  become: true
  ansible.builtin.shell: set -o pipefail && curl -fsSL https://bws.bitwarden.com/install | sh
  args:
    creates: /usr/local/bin/bws
    executable: /bin/bash

- name: Package Installation | Azure CLI | Check for executable
  ansible.builtin.stat:
    path: /usr/bin/az
  register: az_installed

- name: Package Installation | Azure CLI | Download installer
  ansible.builtin.get_url:
    url: https://aka.ms/InstallAzureCLIDeb
    dest: /tmp/InstallAzureCLIDeb.sh
    mode: '0755'
  when: not az_installed.stat.exists

- name: Package Installation | Azure CLI | Run Installation
  ansible.builtin.command: bash /tmp/InstallAzureCLIDeb.sh
  become: true
  changed_when: not az_installed.stat.exists
  when: not az_installed.stat.exists

- name: Package Installation | Install Starship
  ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: /usr/local/bin/starship
  become: true