# --- APT Packages --- #
- name: Package Installation | Add APT GPG Keys
  ansible.builtin.apt_key:
    url: "{{ item.apt_key_url }}"
    keyring: "{{ item.keyring }}"
  become: true
  with_items: "{{ apt_sources }}"

- name: Package Installation | Add APT Repositories
  ansible.builtin.apt_repository:
    repo: "{{ item.repo: }}"
    state: present
    filename: "{{ item.filename }}"
  become: true
  with_items: "{{ apt_sources }}"

- name: Package Installation | Install Packages
  become: true
  ansible.builtin.apt:
    pkg: "{{ packages }}"
    update_cache: true
  when: ansible_os_family == "Debian"

# --- Other Packages --- #
- name: Package Installation | Azure CLI | Check for executable
  ansible.builtin.stat:
    path: /usr/bin/az
  register: az_installed

- name: Package Installation | Azure CLI | Download installer
  ansible.builtin.get_url:
    url: https://aka.ms/InstallAzureCLIDeb
    dest: /tmp/InstallAzureCLIDeb.sh
    mode: '0755'
  when: not az_installed.stat.exists

- name: Package Installation | Azure CLI | Run Installation
  ansible.builtin.command: bash /tmp/InstallAzureCLIDeb.sh
  become: true
  changed_when: not az_installed.stat.exists
  when: not az_installed.stat.exists

- name: Package Installation | Install Starship
  ansible.builtin.shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: /usr/local/bin/starship
  become: true